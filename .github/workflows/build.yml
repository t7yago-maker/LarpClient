name: Build LarpClient

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair o projeto
        run: |
          unzip -o LarpClient.zip -d proj
          chmod +x proj/LarpClient/gradlew
          ls proj/LarpClient

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        working-directory: proj/LarpClient
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee ../../build.log

      - name: Mostrar o erro no resumo
        if: failure()
        run: |
          echo "## ERRO DO BUILD (tire print desta parte)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -n -E "What went wrong|error:|Could not|FAILED|Caused by|Exception" build.log | head -25 >> $GITHUB_STEP_SUMMARY || true
          echo '--- final do log ---' >> $GITHUB_STEP_SUMMARY
          tail -n 25 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Guardar o JAR
        uses: actions/upload-artifact@v4
        with:
          name: LarpClient-jar
          path: proj/LarpClient/build/libs/*.jar
          if-no-files-found: warn

      - name: Publicar release com o JAR
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LarpClient build ${{ github.run_number }}
          files: proj/LarpClient/build/libs/larpclient-0.1.0.jar
          
