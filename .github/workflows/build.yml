name: Build LarpClient

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Achar e extrair o projeto
        run: |
          echo "Arquivos na raiz do repositorio:"
          ls -la
          Z=""
          BEST=0
          for f in *.zip; do
            [ -f "$f" ] || continue
            unzip -l "$f" | grep -q "gradlew$" || continue
            T=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0)
            echo "zip: $f (commit time $T)"
            if [ "${T:-0}" -ge "$BEST" ]; then BEST="${T:-0}"; Z="$f"; fi
          done
          if [ -z "$Z" ]; then
            {
              echo "## ERRO: nenhum ZIP do LarpClient (com gradlew) foi encontrado no repositorio"
              echo "Envie o LarpClient.zip (Add file > Upload files)."
              echo "ZIPs vistos na raiz: $(ls *.zip 2>&1)"
            } >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "Usando o zip: $Z"
          mkdir proj
          unzip -o "$Z" -d proj
          GW=$(find proj -name gradlew | head -n 1)
          chmod +x "$GW"
          echo "PROJ=$(dirname "$GW")" >> $GITHUB_ENV

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          set -o pipefail
          cd "$PROJ"
          ./gradlew build --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Mostrar o erro no resumo
        if: failure()
        run: |
          if [ -f build.log ]; then
            echo "## ERRO DO BUILD (tire print desta parte)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -n -E "error:|What went wrong|Could not|FAILED|Caused by" build.log | head -40 >> $GITHUB_STEP_SUMMARY || true
            echo '--- final do log ---' >> $GITHUB_STEP_SUMMARY
            tail -n 25 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Separar o JAR
        run: |
          mkdir -p out
          cp "$PROJ"/build/libs/*.jar out/
          ls -la out

      - name: Guardar o JAR
        uses: actions/upload-artifact@v4
        with:
          name: LarpClient-jar
          path: out/*.jar

      - name: Publicar release com o JAR
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LarpClient build ${{ github.run_number }}
          files: out/*.jar
          
